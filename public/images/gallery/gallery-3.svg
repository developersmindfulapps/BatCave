<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#1a1815" />
  <g transform="translate(150, 140)" stroke="#e2b63f" stroke-width="3" fill="none">
    <!-- Gloves Motif -->
    <rect x="20" y="40" width="60" height="90" rx="15" fill="#e2b63f" fill-opacity="0.2" />
    <rect x="100" y="40" width="60" height="90" rx="15" fill="#e2b63f" fill-opacity="0.2" />
    <line x1="20" y1="90" x2="80" y2="90" stroke="#ffffff" stroke-width="2" />
    <line x1="100" y1="90" x2="160" y2="90" stroke="#ffffff" stroke-width="2" />
    <line x1="90" y1="0" x2="90" y2="200" stroke="#e2b63f" stroke-width="5" />
  </g>
  <text x="250" y="400" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">EQUIPMENT &amp; GEAR</text>
