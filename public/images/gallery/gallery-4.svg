<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#101010" />
  <g transform="translate(140, 130)" stroke="#e2b63f" stroke-width="3" fill="none">
    <!-- Bowling Machine Stream -->
    <circle cx="60" cy="80" r="40" stroke="#e2b63f" stroke-width="4" />
    <circle cx="60" cy="80" r="15" fill="#e2b63f" />
    <!-- Stream of cricket balls -->
    <circle cx="160" cy="80" r="14" fill="#dc2626" stroke="#fff" stroke-width="2" />
    <circle cx="230" cy="80" r="14" fill="#dc2626" stroke="#fff" stroke-width="2" opacity="0.6" />
    <line x1="60" y1="140" x2="10" y2="240" stroke="#2e2d27" stroke-width="5" />
    <line x1="60" y1="140" x2="110" y2="240" stroke="#2e2d27" stroke-width="5" />
  </g>
  <text x="250" y="420" fill="#e2b63f" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">MACHINE PRECISION</text>
</svg>
