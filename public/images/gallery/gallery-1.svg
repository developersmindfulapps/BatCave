<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#121212" />
  <circle cx="250" cy="250" r="180" fill="#e2b63f" fill-opacity="0.06" stroke="#2e2d27" />
  <!-- Bat Stroke Motif -->
  <g transform="translate(160, 120)" stroke="#e2b63f" stroke-width="4" fill="none">
    <!-- Cricket Bat -->
    <rect x="70" y="20" width="28" height="150" rx="8" transform="rotate(-30 84 95)" fill="#e2b63f" fill-opacity="0.3" stroke="#e2b63f" stroke-width="3" />
    <line x1="140" y1="180" x2="165" y2="230" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <!-- Ball with impact streaks -->
    <circle cx="40" cy="120" r="18" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <line x1="20" y1="120" x2="-20" y2="120" stroke="#e2b63f" stroke-width="3" stroke-dasharray="4,4" />
    <line x1="25" y1="105" x2="-10" y2="85" stroke="#e2b63f" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="25" y1="135" x2="-10" y2="155" stroke="#e2b63f" stroke-width="2" stroke-dasharray="4,4" />
  </g>
  <text x="250" y="420" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">BAT STRIKE ACTION</text>
</svg>
