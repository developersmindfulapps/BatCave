<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e2b63f" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#e2b63f" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="turfPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="#2e2d27" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152818" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0d1b10" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#turfPattern)" />
  <rect width="100%" height="100%" fill="url(#goldGlow)" />

  <!-- Cricket Net Perspective Lines -->
  <g stroke="#e2b63f" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="960" y1="200" x2="200" y2="1080" />
    <line x1="960" y1="200" x2="1720" y2="1080" />
    <line x1="960" y1="200" x2="700" y2="1080" stroke-opacity="0.08" />
    <line x1="960" y1="200" x2="1220" y2="1080" stroke-opacity="0.08" />
  </g>

  <!-- Central Turf Lane Perspective -->
  <polygon points="820,500 1100,500 1350,1080 570,1080" fill="url(#pitchGrad)" opacity="0.7" />
  <line x1="720" y1="900" x2="1200" y2="900" stroke="#e2b63f" stroke-width="3" stroke-opacity="0.4" />
  <line x1="780" y1="700" x2="1140" y2="700" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- Cricket Stumps Motif at the end of the lane -->
  <g transform="translate(930, 430)" stroke="#e2b63f" stroke-width="3" opacity="0.6">
    <line x1="10" y1="0" x2="10" y2="70" />
    <line x1="30" y1="0" x2="30" y2="70" />
    <line x1="50" y1="0" x2="50" y2="70" />
    <line x1="5" y1="0" x2="55" y2="0" stroke-width="4" />
  </g>
</svg>
