<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNets" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142416" />
      <stop offset="50%" stop-color="#0e1710" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgNets)" />
  <!-- Dual Net Lanes -->
  <g stroke="#2e2d27" stroke-width="2">
    <line x1="300" y1="100" x2="300" y2="750" stroke="#e2b63f" stroke-width="3" stroke-dasharray="10,6" />
    <!-- Left Lane -->
    <rect x="60" y="200" width="180" height="480" rx="12" fill="#122a16" fill-opacity="0.4" stroke="#e2b63f" stroke-opacity="0.3" />
    <!-- Right Lane -->
    <rect x="360" y="200" width="180" height="480" rx="12" fill="#122a16" fill-opacity="0.4" stroke="#e2b63f" stroke-opacity="0.3" />
  </g>
  <!-- Net text badge -->
  <text x="150" y="450" fill="#e2b63f" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="4">NET 1</text>
  <text x="450" y="450" fill="#e2b63f" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="4">NET 2</text>
</svg>
