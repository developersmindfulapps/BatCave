<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2b63f" />
      <stop offset="100%" stop-color="#c89e2e" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="300" cy="350" r="180" fill="#e2b63f" fill-opacity="0.05" />
  <!-- Machine Outline Motif -->
  <g transform="translate(180, 220)" stroke="#e2b63f" stroke-width="3" fill="none">
    <circle cx="120" cy="80" r="70" stroke-width="4" stroke-dasharray="6,4" />
    <circle cx="120" cy="180" r="70" stroke-width="4" stroke-dasharray="6,4" />
    <circle cx="120" cy="130" r="30" fill="#e2b63f" fill-opacity="0.2" />
    <!-- Tripod / Stand -->
    <line x1="120" y1="250" x2="30" y2="420" stroke-width="6" stroke="#2e2d27" />
    <line x1="120" y1="250" x2="210" y2="420" stroke-width="6" stroke="#2e2d27" />
    <line x1="120" y1="250" x2="120" y2="440" stroke-width="6" stroke="#e2b63f" stroke-opacity="0.6" />
    <!-- Ball release path -->
    <circle cx="190" cy="130" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />
    <line x1="190" y1="130" x2="320" y2="130" stroke="#e2b63f" stroke-width="2" stroke-dasharray="4,4" />
  </g>
</svg>
