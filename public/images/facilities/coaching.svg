<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCoaching" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1b12" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgCoaching)" />
  <circle cx="300" cy="300" r="140" fill="#e2b63f" fill-opacity="0.08" stroke="#e2b63f" stroke-width="2" stroke-dasharray="8,6" />
  <!-- Coach & Batting Motif -->
  <g transform="translate(240, 200)" fill="none" stroke="#e2b63f" stroke-width="3">
    <!-- Coach Icon -->
    <circle cx="60" cy="50" r="30" />
    <path d="M10,140 C10,100 30,85 60,85 C90,85 110,100 110,140" />
    <!-- Clipboard / Analysis Tablet -->
    <rect x="25" y="150" width="70" height="90" rx="8" stroke="#ffffff" stroke-width="2" fill="#1a1a1a" />
    <line x1="40" y1="180" x2="80" y2="180" stroke="#e2b63f" stroke-width="2" />
    <line x1="40" y1="200" x2="70" y2="200" stroke="#e2b63f" stroke-width="2" />
    <line x1="40" y1="220" x2="60" y2="220" stroke="#e2b63f" stroke-width="2" />
  </g>
  <text x="300" y="550" fill="#e2b63f" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="4">EXPERT DRILLS</text>
</svg>
